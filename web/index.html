<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NeoGen VERA</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#090d18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17203b,#090d18 45%)}button,input,textarea{font:inherit}.hidden{display:none!important}.bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #29324a;background:#0d1322}.brand{font-weight:800;letter-spacing:.08em}.status{font-size:12px;color:#8ee3b1}.shell{display:grid;grid-template-columns:240px 1fr 420px;grid-template-rows:calc(100vh - 56px);gap:1px;background:#29324a}.panel{background:#0d1322;overflow:auto}.panel h3{margin:0;padding:14px 16px;border-bottom:1px solid #29324a;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.files,.conversations{padding:8px}.item{padding:8px 10px;border-radius:7px;cursor:pointer;color:#c8d1e8}.item:hover,.item.active{background:#1a2440}.center{display:grid;grid-template-rows:1fr 220px;min-width:0}.editor-wrap{display:grid;grid-template-rows:42px 1fr}.toolbar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #29324a}.toolbar input{flex:1}.editor{width:100%;height:100%;resize:none;border:0;outline:none;padding:16px;background:#0a0f1c;color:#dce6ff;font-family:ui-monospace,monospace}.terminal{display:grid;grid-template-rows:1fr 42px;border-top:1px solid #29324a}.terminal-output{padding:12px;white-space:pre-wrap;font-family:ui-monospace,monospace;background:#05070d;overflow:auto}.terminal-input{display:flex}.terminal-input input{flex:1}.chat{display:grid;grid-template-rows:42px 1fr 88px}.messages{padding:12px;overflow:auto}.msg{margin:0 0 10px;padding:10px 12px;border-radius:10px;white-space:pre-wrap}.user{background:#22366d}.assistant{background:#18233f}.chatbox{display:flex;gap:8px;padding:10px;border-top:1px solid #29324a}.chatbox textarea{flex:1;resize:none}.card{max-width:420px;margin:10vh auto;background:#11192b;border:1px solid #2b3652;border-radius:14px;padding:22px}.card h1{margin-top:0}.stack{display:grid;gap:10px}input,textarea{background:#0b1120;color:#eef2ff;border:1px solid #33405f;border-radius:8px;padding:10px}button{border:0;border-radius:8px;padding:10px 14px;background:#6d7cff;color:white;cursor:pointer;font-weight:700}button.secondary{background:#26314c}.error{color:#ff9b9b;font-size:13px}@media(max-width:1000px){.shell{grid-template-columns:190px 1fr}.chat{position:fixed;right:0;top:56px;width:380px;height:calc(100vh - 56px);background:#0d1322}.center{grid-column:2}}@media(max-width:700px){.shell{display:block}.panel:first-child{display:none}.chat{position:static;width:auto;height:50vh}.center{height:calc(100vh - 56px)}}
  </style>
</head>
<body>
  <div id="auth" class="card">
    <h1>NeoGen</h1><p>VERA development workspace</p>
    <div class="stack">
      <input id="apiBase" value="http://127.0.0.1:8080/api/v1" aria-label="API base" />
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <input id="displayName" placeholder="Display name (registration)" />
      <div><button id="login">Login</button> <button id="register" class="secondary">Register</button></div>
      <div id="authError" class="error"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="bar"><div class="brand">NEOGEN // VERA</div><div><span id="status" class="status">connected</span> <button id="logout" class="secondary">Logout</button></div></header>
    <main class="shell">
      <aside class="panel"><h3>Workspace</h3><div class="toolbar"><button id="refreshFiles">Refresh</button></div><div id="files" class="files"></div></aside>
      <section class="panel center">
        <div class="editor-wrap"><div class="toolbar"><input id="filePath" placeholder="path/to/file.py"/><button id="saveFile">Save</button></div><textarea id="editor" class="editor" spellcheck="false"></textarea></div>
        <div class="terminal"><pre id="terminalOutput" class="terminal-output">NeoGen terminal ready.</pre><div class="terminal-input"><input id="terminalCommand" placeholder="python --version"/><button id="runCommand">Run</button></div></div>
      </section>
      <aside class="panel chat"><h3>VERA</h3><div id="messages" class="messages"></div><div class="chatbox"><textarea id="prompt" placeholder="Ask VERA..."></textarea><button id="send">Send</button></div></aside>
    </main>
  </div>

<script src="https://js.puter.com/v2/"></script>
<script>
const $=id=>document.getElementById(id);const state={token:localStorage.neogenToken||'',conversation:null,sha:null};
function apiBase(){return $('apiBase').value.replace(/\/$/,'')}async function request(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(apiBase()+path,{...opts,headers});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||r.statusText);return data}
function showApp(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');loadFiles();ensureConversation() }
async function login(register=false){$('authError').textContent='';try{if(register)await request('/auth/register',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value,display_name:$('displayName').value})});const s=await request('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});state.token=s.token;localStorage.neogenToken=s.token;showApp()}catch(e){$('authError').textContent=e.message}}
$('login').onclick=()=>login(false);$('register').onclick=()=>login(true);$('logout').onclick=async()=>{try{await request('/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('neogenToken');location.reload()};
async function loadFiles(){try{const d=await request('/workspace/list?recursive=true');$('files').innerHTML='';for(const f of d.items){const el=document.createElement('div');el.className='item';el.textContent=(f.kind==='directory'?'▸ ':'')+f.path;if(f.kind==='file')el.onclick=()=>openFile(f.path);$('files').appendChild(el)}}catch(e){$('status').textContent=e.message}}
async function openFile(path){try{const d=await request('/workspace/read?path='+encodeURIComponent(path));$('filePath').value=d.path;$('editor').value=d.content;state.sha=d.sha256}catch(e){alert(e.message)}}
$('refreshFiles').onclick=loadFiles;$('saveFile').onclick=async()=>{try{const d=await request('/workspace/write',{method:'POST',body:JSON.stringify({path:$('filePath').value,content:$('editor').value,expected_sha256:state.sha})});state.sha=d.sha256;await loadFiles();$('status').textContent='saved '+d.path}catch(e){alert(e.message)}};
$('runCommand').onclick=runTerminal;$('terminalCommand').addEventListener('keydown',e=>{if(e.key==='Enter')runTerminal()});async function runTerminal(){const text=$('terminalCommand').value.trim();if(!text)return;const args=text.match(/(?:[^\s"]+|"[^"]*")+/g)?.map(x=>x.replace(/^"|"$/g,''))||[];$('terminalOutput').textContent+='\n$ '+text;try{const r=await request('/terminal/execute',{method:'POST',body:JSON.stringify({command:args})});$('terminalOutput').textContent+='\n'+r.stdout+(r.stderr?'\n'+r.stderr:'')+'\n[exit '+r.exit_code+']'}catch(e){$('terminalOutput').textContent+='\nERROR: '+e.message}$('terminalCommand').value='';$('terminalOutput').scrollTop=$('terminalOutput').scrollHeight}
async function ensureConversation(){const d=await request('/conversations');if(d.items.length)state.conversation=d.items[0].id;else state.conversation=(await request('/conversations',{method:'POST',body:JSON.stringify({title:'VERA Workspace'})})).id;loadMessages()}
async function loadMessages(){if(!state.conversation)return;const d=await request('/conversations/'+encodeURIComponent(state.conversation)+'/messages');$('messages').innerHTML='';for(const m of d.items)addMessage(m.role,m.content)}function addMessage(role,content){const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'assistant');el.textContent=content;$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight}
$('send').onclick=sendChat;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});async function sendChat(){const prompt=$('prompt').value.trim();if(!prompt||!state.conversation)return;$('prompt').value='';addMessage('user',prompt);try{const envelope=await request('/conversations/'+encodeURIComponent(state.conversation)+'/chat',{method:'POST',body:JSON.stringify({prompt})});let answer='VERA request prepared.';if(window.puter?.ai?.chat){const history=(envelope.execution?.payload?.arguments?.messages)||[{role:'user',content:prompt}];const result=await puter.ai.chat(history);answer=typeof result==='string'?result:(result?.message?.content||result?.content||JSON.stringify(result));}await request('/conversations/'+encodeURIComponent(state.conversation)+'/responses',{method:'POST',body:JSON.stringify({content:answer,provider:'puter'})});addMessage('assistant',answer)}catch(e){addMessage('assistant','Error: '+e.message)}}
(async()=>{if(state.token){try{await request('/auth/me');showApp()}catch{localStorage.removeItem('neogenToken');state.token=''}}})();
</script>
</body>
</html>
