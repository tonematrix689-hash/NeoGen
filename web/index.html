<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeoGen Afterlife</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#080c16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#192544,#080c16 46%)}button,input,textarea{font:inherit}.hidden{display:none!important}.bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0d1424;border-bottom:1px solid #293550}.brand{font-weight:900;letter-spacing:.09em}.status{color:#8be3ae;font-size:12px}.tabs{display:flex;gap:6px;padding:8px;background:#0b111f;border-bottom:1px solid #293550}.tabs button.active{background:#7181ff}.view{display:none;height:calc(100vh - 108px)}.view.active{display:grid}.work{grid-template-columns:230px 1fr 390px;gap:1px;background:#293550}.panel{background:#0d1424;overflow:auto}.panel h3{margin:0;padding:13px 14px;border-bottom:1px solid #293550;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.toolbar{display:flex;gap:8px;padding:7px;border-bottom:1px solid #293550}.toolbar input{flex:1}.item{padding:8px 10px;margin:3px;border-radius:7px;cursor:pointer;color:#cad4ec}.item:hover{background:#1b2744}.center{display:grid;grid-template-rows:1fr 210px}.editor-wrap{display:grid;grid-template-rows:44px 1fr}.editor{width:100%;height:100%;resize:none;border:0;outline:0;padding:14px;background:#090f1c;color:#dce6ff;font-family:ui-monospace,monospace}.terminal{display:grid;grid-template-rows:1fr 42px;border-top:1px solid #293550}.terminal-output{margin:0;padding:12px;white-space:pre-wrap;background:#05070d;overflow:auto;font-family:ui-monospace,monospace}.terminal-input{display:flex}.terminal-input input{flex:1}.chat{display:grid;grid-template-rows:42px 1fr 88px}.messages{padding:12px;overflow:auto}.msg{padding:10px 12px;border-radius:10px;margin-bottom:9px;white-space:pre-wrap}.user{background:#243c78}.assistant{background:#182440}.chatbox{display:flex;gap:8px;padding:10px;border-top:1px solid #293550}.chatbox textarea{flex:1;resize:none}.game{grid-template-columns:1fr 1fr;gap:12px;padding:14px;background:#090e19;overflow:auto}.card{background:#111a2e;border:1px solid #2b3958;border-radius:14px;padding:16px}.auth{max-width:420px;margin:9vh auto}.stack{display:grid;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.listing{border:1px solid #33415f;border-radius:10px;padding:12px}.balance{font-size:34px;font-weight:900}.muted{color:#9ba9c5}.error{color:#ff9b9b}input,textarea{background:#0a1120;color:#eef2ff;border:1px solid #33415f;border-radius:8px;padding:10px}button{border:0;border-radius:8px;padding:9px 13px;background:#697aff;color:white;font-weight:750;cursor:pointer}button.secondary{background:#26334f}@media(max-width:900px){.work{grid-template-columns:180px 1fr}.chat{position:fixed;right:0;top:108px;width:350px;height:calc(100vh - 108px)}.game{grid-template-columns:1fr}}@media(max-width:650px){.work{display:block;overflow:auto}.work>.panel:first-child{display:none}.center{height:70vh}.chat{position:static;width:auto;height:55vh}.game{display:block}.card{margin-bottom:12px}}</style></head><body>
<div id="auth" class="card auth"><h1>NeoGen</h1><p class="muted">VERA + Afterlife Neogenesis MVP</p><div class="stack"><input id="apiBase" value="http://127.0.0.1:8080/api/v1"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="displayName" placeholder="Display name (registration)"><div><button id="login">Login</button> <button id="register" class="secondary">Register</button></div><div id="authError" class="error"></div></div></div>
<div id="app" class="hidden"><header class="bar"><div class="brand">NEOGEN // AFTERLIFE</div><div><span id="status" class="status">connected</span> <button id="logout" class="secondary">Logout</button></div></header><nav class="tabs"><button data-view="workspace" class="active">VERA Workspace</button><button data-view="game">Avatar & Economy</button></nav>
<main id="workspace" class="view work active"><aside class="panel"><h3>Workspace</h3><div class="toolbar"><button id="refreshFiles">Refresh</button></div><div id="files"></div></aside><section class="panel center"><div class="editor-wrap"><div class="toolbar"><input id="filePath" placeholder="path/to/file.py"><button id="saveFile">Save</button></div><textarea id="editor" class="editor" spellcheck="false"></textarea></div><div class="terminal"><pre id="terminalOutput" class="terminal-output">NeoGen terminal ready.</pre><div class="terminal-input"><input id="terminalCommand" placeholder="python --version"><button id="runCommand">Run</button></div></div></section><aside class="panel chat"><h3>VERA</h3><div id="messages" class="messages"></div><div class="chatbox"><textarea id="prompt" placeholder="Ask VERA..."></textarea><button id="send">Send</button></div></aside></main>
<main id="game" class="view game"><section class="card"><h2>Avatar</h2><input id="avatarName" placeholder="Avatar name"><textarea id="avatarAppearance" rows="5" placeholder='Appearance JSON, e.g. {"hair":"silver"}'></textarea><p>Level: <strong id="avatarLevel">1</strong></p><button id="saveAvatar">Save Avatar</button></section><section class="card"><h2>ACoin Wallet</h2><div class="balance"><span id="balance">0</span> AC</div><button id="refreshEconomy">Refresh</button><h3>Transactions</h3><div id="transactions" class="stack"></div></section><section class="card"><h2>Inventory</h2><div id="inventory" class="grid"></div></section><section class="card"><h2>Marketplace</h2><div class="stack"><input id="listingName" placeholder="Listing name"><input id="listingPrice" type="number" min="1" placeholder="Price"><input id="listingType" placeholder="Item type"><input id="listingRarity" type="number" min="1" max="100" value="1"><button id="createListing">Create Listing</button></div><hr><div id="marketplace" class="grid"></div></section></main></div>
<script src="https://js.puter.com/v2/"></script><script>
const $=id=>document.getElementById(id);const state={token:localStorage.neogenToken||'',conversation:null,sha:null};function apiBase(){return $('apiBase').value.replace(/\/$/,'')}async function request(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(apiBase()+path,{...opts,headers});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||r.statusText);return data}function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');loadFiles();ensureConversation();loadGame()}
async function login(register=false){$('authError').textContent='';try{if(register)await request('/auth/register',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value,display_name:$('displayName').value})});const s=await request('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});state.token=s.token;localStorage.neogenToken=s.token;showApp()}catch(e){$('authError').textContent=e.message}}$('login').onclick=()=>login(false);$('register').onclick=()=>login(true);$('logout').onclick=async()=>{try{await request('/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('neogenToken');location.reload()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view));if(b.dataset.view==='game')loadGame()});
async function loadFiles(){try{const d=await request('/workspace/list?recursive=true');$('files').innerHTML='';for(const f of d.items){const el=document.createElement('div');el.className='item';el.textContent=(f.kind==='directory'?'▸ ':'')+f.path;if(f.kind==='file')el.onclick=()=>openFile(f.path);$('files').appendChild(el)}}catch(e){$('status').textContent=e.message}}async function openFile(path){const d=await request('/workspace/read?path='+encodeURIComponent(path));$('filePath').value=d.path;$('editor').value=d.content;state.sha=d.sha256}$('refreshFiles').onclick=loadFiles;$('saveFile').onclick=async()=>{try{const d=await request('/workspace/write',{method:'POST',body:JSON.stringify({path:$('filePath').value,content:$('editor').value,expected_sha256:state.sha})});state.sha=d.sha256;await loadFiles();$('status').textContent='saved '+d.path}catch(e){alert(e.message)}};
$('runCommand').onclick=runTerminal;$('terminalCommand').addEventListener('keydown',e=>{if(e.key==='Enter')runTerminal()});async function runTerminal(){const text=$('terminalCommand').value.trim();if(!text)return;const args=text.match(/(?:[^\s"]+|"[^"]*")+/g)?.map(x=>x.replace(/^"|"$/g,''))||[];$('terminalOutput').textContent+='\n$ '+text;try{const r=await request('/terminal/execute',{method:'POST',body:JSON.stringify({command:args})});$('terminalOutput').textContent+='\n'+r.stdout+(r.stderr?'\n'+r.stderr:'')+'\n[exit '+r.exit_code+']'}catch(e){$('terminalOutput').textContent+='\nERROR: '+e.message}$('terminalCommand').value='';$('terminalOutput').scrollTop=$('terminalOutput').scrollHeight}
async function ensureConversation(){const d=await request('/conversations');state.conversation=d.items.length?d.items[0].id:(await request('/conversations',{method:'POST',body:JSON.stringify({title:'VERA Workspace'})})).id;loadMessages()}async function loadMessages(){if(!state.conversation)return;const d=await request('/conversations/'+encodeURIComponent(state.conversation)+'/messages');$('messages').innerHTML='';d.items.forEach(m=>addMessage(m.role,m.content))}function addMessage(role,content){const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'assistant');el.textContent=content;$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight}$('send').onclick=sendChat;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});async function sendChat(){const prompt=$('prompt').value.trim();if(!prompt||!state.conversation)return;$('prompt').value='';addMessage('user',prompt);try{const envelope=await request('/conversations/'+encodeURIComponent(state.conversation)+'/chat',{method:'POST',body:JSON.stringify({prompt})});let answer='VERA request prepared.';if(window.puter?.ai?.chat){const history=envelope.execution?.payload?.arguments?.messages||[{role:'user',content:prompt}];const result=await puter.ai.chat(history);answer=typeof result==='string'?result:(result?.message?.content||result?.content||JSON.stringify(result))}await request('/conversations/'+encodeURIComponent(state.conversation)+'/responses',{method:'POST',body:JSON.stringify({content:answer,provider:'puter'})});addMessage('assistant',answer)}catch(e){addMessage('assistant','Error: '+e.message)}}
async function loadGame(){try{const [a,w,i,t,m]=await Promise.all([request('/avatar'),request('/wallet'),request('/inventory'),request('/wallet/transactions'),request('/marketplace')]);$('avatarName').value=a.name;$('avatarAppearance').value=JSON.stringify(a.appearance||{},null,2);$('avatarLevel').textContent=a.level;$('balance').textContent=w.balance;$('inventory').innerHTML=i.items.length?'':'<span class="muted">No items yet</span>';i.items.forEach(x=>$('inventory').appendChild(tile(x.name,'Rarity '+x.rarity)));$('transactions').innerHTML=t.items.length?'':'<span class="muted">No transactions</span>';t.items.slice(-8).reverse().forEach(x=>$('transactions').appendChild(tile((x.amount>0?'+':'')+x.amount+' AC',x.reason)));$('marketplace').innerHTML=m.items.length?'':'<span class="muted">No active listings</span>';m.items.forEach(x=>{const el=tile(x.name,x.price+' AC');const b=document.createElement('button');b.textContent='Buy';b.onclick=()=>buy(x.id);el.appendChild(b);$('marketplace').appendChild(el)})}catch(e){$('status').textContent=e.message}}function tile(title,sub){const el=document.createElement('div');el.className='listing';const h=document.createElement('strong');h.textContent=title;const p=document.createElement('div');p.className='muted';p.textContent=sub;el.append(h,p);return el}$('refreshEconomy').onclick=loadGame;$('saveAvatar').onclick=async()=>{try{let appearance={};try{appearance=JSON.parse($('avatarAppearance').value||'{}')}catch{throw new Error('Appearance must be valid JSON')}await request('/avatar',{method:'POST',body:JSON.stringify({name:$('avatarName').value,appearance})});loadGame()}catch(e){alert(e.message)}};$('createListing').onclick=async()=>{try{await request('/marketplace/list',{method:'POST',body:JSON.stringify({name:$('listingName').value,description:'Player listing',price:Number($('listingPrice').value),item:{name:$('listingName').value,item_type:$('listingType').value||'cosmetic',rarity:Number($('listingRarity').value)||1}})});loadGame()}catch(e){alert(e.message)}};async function buy(id){try{await request('/marketplace/purchase',{method:'POST',body:JSON.stringify({listing_id:id})});loadGame()}catch(e){alert(e.message)}}
(async()=>{if(state.token){try{await request('/auth/me');showApp()}catch{localStorage.removeItem('neogenToken');state.token=''}}})();</script></body></html>
