<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070913">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NeoGen">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/neogen-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/neogen-icon.svg">
  <title>NeoGen Afterlife</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#f4f7ff;background:#070913}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(202,215,235,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(202,215,235,.025) 1px,transparent 1px),radial-gradient(circle at 35% 0,rgba(37,136,255,.18),transparent 34%),radial-gradient(circle at 80% 82%,rgba(132,86,255,.12),transparent 32%),#070913;background-size:42px 42px,42px 42px,auto,auto,auto}
    main{width:min(520px,100%);padding:38px;border:1px solid rgba(202,215,235,.17);border-radius:26px;background:linear-gradient(145deg,rgba(23,29,42,.96),rgba(8,11,19,.98));text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.44)}
    .mark{position:relative;width:64px;height:64px;margin:0 auto 25px;display:grid;place-items:center;border:1px solid rgba(235,242,250,.65);border-radius:50%;background:radial-gradient(circle at 34% 25%,#fff 0 6%,#dceaf6 7% 16%,#8294a9 34%,#273043 61%,#0b101b 78%);box-shadow:0 0 0 9px rgba(202,215,235,.04),0 0 55px rgba(37,136,255,.27),0 0 85px rgba(132,86,255,.18);font-size:22px;font-weight:900}
    .mark:after{content:"";position:absolute;inset:-17px;border:1px solid rgba(200,210,223,.32);border-radius:50%;transform:rotate(24deg) scaleY(.44)}
    h1{margin:0 0 8px;letter-spacing:-.045em}.muted{color:#a5aec2;line-height:1.55}.status{margin:20px 0;padding:12px;border:1px solid rgba(202,215,235,.09);border-radius:12px;background:#171d2a;color:#c4ccda}
    button,a{display:inline-block;border:0;border-radius:12px;padding:12px 17px;background:linear-gradient(135deg,#176cff,#7448ef 58%,#a62f59);color:white;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}
    button[hidden]{display:none}.secondary{border:1px solid rgba(202,215,235,.13);background:#20283a;margin-left:8px}
  </style>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>NeoGen</h1>
    <p class="muted">VERA intelligence, governed AI workspace, and an Afterlife universe with no final edge.</p>
    <div id="status" class="status">Preparing the tablet app…</div>
    <button id="install" hidden>Install NeoGen</button>
    <a id="open" href="./index.html" class="secondary">Open NeoGen</a>
  </main>
  <script>
    let installPrompt = null;
    const status = document.getElementById('status');
    const install = document.getElementById('install');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(() => { status.textContent = navigator.onLine ? 'NeoGen is ready.' : 'NeoGen is ready offline.'; })
        .catch((error) => { status.textContent = 'App loaded, but offline caching failed: ' + error.message; });
    } else {
      status.textContent = 'NeoGen is ready. This browser does not support offline installation.';
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      installPrompt = event;
      install.hidden = false;
      status.textContent = 'NeoGen can now be installed on this tablet.';
    });

    install.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      install.hidden = true;
    });

    window.addEventListener('appinstalled', () => {
      status.textContent = 'NeoGen has been installed.';
      install.hidden = true;
    });
  </script>
</body>
</html>
