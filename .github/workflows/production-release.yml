name: Production release validation

on:
  push:
    branches:
      - agent/production-publishing
      - main
  pull_request:
    branches:
      - main
      - agent/vera-autonomous-workflow

permissions:
  contents: read

concurrency:
  group: production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall -q genesis tests

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Validate browser JavaScript
        run: node --check web/assets/neogen.js

      - name: Build production container
        run: docker build --tag neogen:release .

      - name: Smoke-test production container
        run: |
          docker run --detach --rm --name neogen-release -p 127.0.0.1:8080:8080 neogen:release
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs neogen-release
          exit 1
