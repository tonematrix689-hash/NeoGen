name: Deploy NeoGen PWA

on:
  push:
    branches:
      - main
      - agent/neogen-core-foundation
    paths:
      - "web/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate PWA files
        run: |
          test -f web/index.html
          test -f web/pwa.html
          test -f web/manifest.webmanifest
          test -f web/service-worker.js
          test -f web/icons/neogen-icon.svg

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
