name: NeoGen MVP CI

on:
  push:
    branches:
      - main
      - agent/neogen-core-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Compile source
        run: python -m compileall -q genesis tests

      - name: Run unit and MVP regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Import API server
        run: python -c "from genesis.api.server import create_server; print('NeoGen API import OK')"
